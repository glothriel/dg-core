name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t "dg-core:$GITHUB_REF_NAME" .
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save "dg-core:$GITHUB_REF_NAME" | gzip -1 > "dist/dg-core-$GITHUB_REF_NAME-docker-linux-amd64.tar.gz"
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r .tag .release/context.json)" = "$GITHUB_REF_NAME"
          flags=(--draft --latest=false)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag "${flags[@]}" --title "dg-core $GITHUB_REF_NAME" --notes-file .release/notes.md
