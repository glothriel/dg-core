name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t "dg-core:$GITHUB_REF_NAME" .
      - name: Package RC payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save "dg-core:$GITHUB_REF_NAME" | gzip -1 > "dist/dg-core-$GITHUB_REF_NAME-docker-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-payloads
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  promote:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Promote approved RC bytes (never build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/promote.py
